name = "competitor-insights-source-capture"
main = "source-capture.mjs"
compatibility_date = "2026-07-31"

# 生产与 Preview 均仅开放人工 POST 路由，不配置 Cron。
[env.preview]
name = "competitor-insights-source-capture-preview"

# Preview 的全局单例持久队列；Alarm 替代 Cron 与请求 waitUntil。
[[env.preview.durable_objects.bindings]]
name = "CANDIDATE_AI_QUEUE"
class_name = "CandidateAiQueue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CandidateAiQueue"]

# 仅在 Cloudflare Worker 的加密环境变量中配置：
# SUPABASE_URL=https://<project-ref>.supabase.co
# SUPABASE_PUBLISHABLE_KEY=<public-anon-or-publishable-key，用于验证用户 JWT>
# SUPABASE_SERVICE_ROLE_KEY=<secret>
# 绝不可把 service-role key 放入 Pages、浏览器运行时配置或 Git。
