<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 基础页面设置：定义中文语言、字符编码和移动端显示方式 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 浏览器标签页显示的页面名称 -->
  <title>竞品洞察台</title>

  <style>
    /* ==============================
       全局样式
       统一元素尺寸计算方式
       ============================== */
    * {
      box-sizing: border-box;
    }

    /* ==============================
       页面主体
       设置整体字体、文字颜色和背景色
       ============================== */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #1f2937;
      background: #f5f7fb;
    }

    /* ==============================
       顶部导航栏
       展示产品名称和英文名称
       ============================== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 40px;
      color: white;
      background: #4f46e5;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    /* ==============================
       页面主要内容区域
       限制最大宽度并保持居中
       ============================== */
    main {
      max-width: 1050px;
      margin: 36px auto;
      padding: 0 24px;
    }

    /* ==============================
       产品介绍区域
       展示产品价值和添加竞品按钮
       ============================== */
    .hero {
      padding: 32px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .06);
    }

    .hero h2 {
      margin-top: 0;
    }

    .hero p {
      color: #6b7280;
      line-height: 1.7;
    }

    /* ==============================
       通用按钮
       用于添加和保存等主要操作
       ============================== */
    button {
      padding: 11px 18px;
      color: white;
      background: #4f46e5;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    /* ==============================
       竞品档案区域标题
       ============================== */
    .section-title {
      margin: 32px 0 16px;
    }

    /* ==============================
       竞品卡片网格
       根据屏幕宽度自动调整列数
       ============================== */
    .grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(250px, 1fr)
      );
      gap: 16px;
    }

    /* ==============================
       单个竞品卡片
       展示产品名称、定位和官网
       ============================== */
    .card {
      padding: 20px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
    }

    .card h3 {
      margin: 0 0 10px;
    }

    .card p {
      min-height: 48px;
      color: #6b7280;
    }

    .card a {
      color: #4f46e5;
      text-decoration: none;
    }

    /* ==============================
       竞品卡片操作区
       提供编辑和删除当前竞品的操作
       ============================== */
    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .edit-button {
      background: #4f46e5;
    }

    .delete-button {
      background: #dc2626;
    }

    /* ==============================
       调研证据区域
       展示证据操作栏和图片证据卡片
       ============================== */
    .section-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin: 36px 0 16px;
    }

    .section-toolbar h2 {
      margin: 0;
    }

    .evidence-card {
      overflow: hidden;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
    }

    .evidence-card img {
      display: block;
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #e5e7eb;
    }

    .evidence-content {
      padding: 18px;
    }

    .evidence-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      color: #6b7280;
      font-size: 14px;
    }

    .evidence-comment {
      margin: 0;
      color: #374151;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    /* ==============================
       图片上传预览
       用户选择图片后在保存前预览
       ============================== */
    .image-preview {
      display: none;
      width: 100%;
      max-height: 240px;
      object-fit: contain;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #f8fafc;
    }

    .form-help {
      margin: -6px 0 0;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.5;
    }

    select {
      width: 100%;
      padding: 10px 12px;
      font: inherit;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: white;
    }

    /* ==============================
       空状态
       没有竞品数据时显示提示信息
       ============================== */
    .empty {
      padding: 28px;
      color: #6b7280;
      text-align: center;
      background: white;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
    }

    /* ==============================
       添加竞品弹窗
       用于填写竞品基本信息
       ============================== */
    dialog {
      width: min(460px, calc(100% - 32px));
      padding: 24px;
      border: 0;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .2);
    }

    /* 弹窗打开时的页面半透明遮罩 */
    dialog::backdrop {
      background: rgba(15, 23, 42, .5);
    }

    /* ==============================
       添加竞品表单
       设置输入项之间的间距
       ============================== */
    form {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 6px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px 12px;
      font: inherit;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }/* ==============================
       弹窗底部操作按钮区域
       ============================== */
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* 次要按钮：用于取消操作 */
    .secondary {
      color: #374151;
      background: #e5e7eb;
    }
  </style>
</head>

<body>
  <!-- ==============================
       顶部导航栏
       展示当前产品名称
       ============================== -->
  <header>
    <h1>竞品洞察台</h1>
    <span>Competitor Insights</span>
  </header>

  <!-- ==============================
       页面主要内容
       包含产品介绍和竞品档案
       ============================== -->
  <main>
    <!-- 产品介绍和主要操作区域 -->
    <section class="hero">
      <h2>让竞品研究更有依据</h2>

      <p>
        集中管理竞品档案、调研证据、横向对比和关键洞察。
      </p>

      <!-- 点击后打开添加竞品弹窗 -->
      <button id="addButton">
        添加竞品
      </button>
    </section>

    <!-- 竞品档案列表区域 -->
    <h2 class="section-title">竞品档案</h2>

    <!-- JavaScript 会把竞品卡片显示在这里 -->
    <section
      id="competitorList"
      class="grid">
    </section>

    <!-- ==============================
         调研证据区域
         展示与竞品关联的图片和评论
         ============================== -->
    <div class="section-toolbar">
      <h2>调研证据</h2>
      <button id="addEvidenceButton">
        添加证据
      </button>
    </div>

    <!-- JavaScript 会把调研证据卡片显示在这里 -->
    <section
      id="evidenceList"
      class="grid">
    </section>
  </main>

  <!-- ==============================
       添加竞品弹窗
       收集产品名称、官网和产品定位
       ============================== -->
  <dialog id="competitorDialog">
    <form id="competitorForm">
      <!-- 编辑竞品时，JavaScript 会把标题改为“编辑竞品” -->
      <h2 id="dialogTitle">添加竞品</h2>

      <!-- 竞品名称：必填 -->
      <label>
        产品名称
        <input
          id="name"
          required
          placeholder="例如：Notion">
      </label>

      <!-- 竞品官网：选填，需要符合网址格式 -->
      <label>
        官网链接
        <input
          id="website"
          type="url"
          placeholder="https://example.com">
      </label>

      <!-- 产品定位：选填 -->
      <label>
        产品定位
        <textarea
          id="positioning"
          placeholder="用一句话描述产品定位"></textarea>
      </label>

      <!-- 表单操作按钮 -->
      <div class="actions">
        <button
          class="secondary"
          id="cancelButton"
          type="button">
          取消
        </button>

        <button id="saveButton" type="submit">
          保存竞品
        </button>
      </div>
    </form>
  </dialog>

  <!-- ==============================
       添加调研证据弹窗
       上传图片并填写对应评论
       ============================== -->
  <dialog id="evidenceDialog">
    <form id="evidenceForm">
      <h2>添加调研证据</h2>

      <!-- 选择这条证据对应的竞品 -->
      <label>
        对应竞品
        <select id="evidenceCompetitor" required>
        </select>
      </label>

      <!-- 从本地设备选择一张图片 -->
      <label>
        证据图片
        <input
          id="evidenceImage"
          type="file"
          accept="image/*"
          required>
      </label>

      <p class="form-help">
        图片会自动压缩后保存在当前浏览器中。建议单张原图不超过 10MB。
      </p>

      <!-- 选择图片后显示压缩前的预览 -->
      <img
        id="evidencePreview"
        class="image-preview"
        alt="待上传证据图片预览">

      <!-- 填写对图片内容的观察或评论 -->
      <label>
        证据评论
        <textarea
          id="evidenceComment"
          required
          placeholder="描述图片展示了什么，以及你从中发现了什么"></textarea>
      </label>

      <!-- 证据表单操作按钮 -->
      <div class="actions">
        <button
          class="secondary"
          id="cancelEvidenceButton"
          type="button">
          取消
        </button>

        <button id="saveEvidenceButton" type="submit">
          保存证据
        </button>
      </div>
    </form>
  </dialog>

  <script>
    /* ==============================
       数据存储设置
       定义浏览器 localStorage 使用的名称
       ============================== */
    const storageKey = 'competitor-insights-items';
    const evidenceStorageKey = 'competitor-insights-evidence';

    /* ==============================
       获取页面元素
       方便后续操作竞品列表、弹窗和表单
       ============================== */
    const list =
      document.querySelector('#competitorList');

    const dialog =
      document.querySelector('#competitorDialog');

    const form =
      document.querySelector('#competitorForm');

    const dialogTitle =
      document.querySelector('#dialogTitle');

    const saveButton =
      document.querySelector('#saveButton');

    const evidenceList =
      document.querySelector('#evidenceList');

    const evidenceDialog =
      document.querySelector('#evidenceDialog');

    const evidenceForm =
      document.querySelector('#evidenceForm');

    const evidenceCompetitor =
      document.querySelector('#evidenceCompetitor');

    const evidenceImage =
      document.querySelector('#evidenceImage');

    const evidencePreview =
      document.querySelector('#evidencePreview');

    const saveEvidenceButton =
      document.querySelector('#saveEvidenceButton');

    /* ==============================
       读取已经保存的竞品
       如果没有数据，则使用空数组
       ============================== */
    let competitors = JSON.parse(
      localStorage.getItem(storageKey) || '[]'
    );

    /* 为旧版竞品数据补充唯一编号
       证据通过编号与竞品建立稳定关联 */
    competitors = competitors.map(item => ({
      ...item,
      id: item.id || createId()
    }));
    localStorage.setItem(
      storageKey,
      JSON.stringify(competitors)
    );

    /* 读取浏览器中已经保存的调研证据 */
    let evidenceItems = JSON.parse(
      localStorage.getItem(evidenceStorageKey) || '[]'
    );

    /* 当前正在编辑的竞品序号
       null 表示正在添加新竞品 */
    let editingIndex = null;

    /* ==============================
       渲染竞品列表
       根据数据生成空状态或竞品卡片
       ============================== */
    function render() {
      /* 每次竞品变化后同步更新证据表单和证据卡片 */
      populateEvidenceCompetitors();
      renderEvidence();

      /* 没有竞品时显示空状态 */
      if (competitors.length === 0) {
        list.innerHTML = `
          <div class="empty">
            还没有竞品，点击上方按钮添加第一个。
          </div>
        `;

        return;
      }

      /* 有竞品时生成对应的竞品卡片 */
      list.innerHTML = competitors
        .map((item, index) => `
          <article class="card">
            <h3>${escapeHtml(item.name)}</h3>

            <p>
              ${escapeHtml(
                item.positioning || '暂未填写产品定位'
              )}
            </p>

            ${
              item.website
                ? `
                  <a
                    href="${escapeHtml(item.website)}"
                    target="_blank"
                    rel="noopener">
                    访问官网 →
                  </a>
                `
                : ''
            }

            <!-- 编辑和删除按钮通过 data-index 识别当前竞品 -->
            <div class="card-actions">
              <button
                class="edit-button"
                data-action="edit"
                data-index="${index}">
                编辑
              </button>

              <button
                class="delete-button"
                data-action="delete"
                data-index="${index}">
                删除
              </button>
            </div>
          </article>
        `)
        .join('');
    }

    /* ==============================
       生成唯一编号
       用于稳定关联竞品和调研证据
       ============================== */
    function createId() {
      if (
        window.crypto &&
        typeof window.crypto.randomUUID === 'function'
      ) {
        return window.crypto.randomUUID();
      }

      return `${Date.now()}-${Math.random()}`;
    }

    /* ==============================
       更新证据表单中的竞品选项
       竞品新增、编辑或删除后自动同步
       ============================== */
    function populateEvidenceCompetitors() {
      const selectedValue = evidenceCompetitor.value;

      if (competitors.length === 0) {
        evidenceCompetitor.innerHTML = `
          <option value="">请先添加竞品</option>
        `;
        return;
      }

      evidenceCompetitor.innerHTML = competitors
        .map(item => `
          <option value="${escapeHtml(item.id)}">
            ${escapeHtml(item.name)}
          </option>
        `)
        .join('');

      /* 如果原选项仍然存在，则保持原来的选择 */
      if (
        competitors.some(item => item.id === selectedValue)
      ) {
        evidenceCompetitor.value = selectedValue;
      }
    }

    /* ==============================
       渲染调研证据列表
       展示证据图片、对应竞品、日期和评论
       ============================== */
    function renderEvidence() {
      if (evidenceItems.length === 0) {
        evidenceList.innerHTML = `
          <div class="empty">
            还没有调研证据，点击“添加证据”上传第一张图片。
          </div>
        `;
        return;
      }

      evidenceList.innerHTML = evidenceItems
        .map((item, index) => {
          const competitor = competitors.find(
            entry => entry.id === item.competitorId
          );
          const competitorName = competitor
            ? competitor.name
            : '已删除的竞品';
          const createdDate = new Date(
            item.createdAt
          ).toLocaleDateString('zh-CN');

          return `
            <article class="evidence-card">
              <img
                src="${escapeHtml(item.image)}"
                alt="${escapeHtml(competitorName)}的调研证据">

              <div class="evidence-content">
                <div class="evidence-meta">
                  <strong>${escapeHtml(competitorName)}</strong>
                  <span>${escapeHtml(createdDate)}</span>
                </div>

                <p class="evidence-comment">
                  ${escapeHtml(item.comment)}
                </p>

                <div class="card-actions">
                  <button
                    class="delete-button"
                    data-evidence-action="delete"
                    data-index="${index}">
                    删除证据
                  </button>
                </div>
              </div>
            </article>
          `;
        })
        .join('');
    }

    /* ==============================
       重置证据表单
       清空图片、评论和图片预览
       ============================== */
    function resetEvidenceForm() {
      evidenceForm.reset();
      evidencePreview.removeAttribute('src');
      evidencePreview.style.display = 'none';
      saveEvidenceButton.disabled = false;
      saveEvidenceButton.textContent = '保存证据';
      populateEvidenceCompetitors();
    }

    /* ==============================
       压缩证据图片
       限制最长边为 1600 像素并输出 JPEG
       ============================== */
    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => {
          const image = new Image();

          image.onload = () => {
            const maxSize = 1600;
            const scale = Math.min(
              1,
              maxSize / Math.max(image.width, image.height)
            );
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(image.width * scale);
            canvas.height = Math.round(image.height * scale);
            const context = canvas.getContext('2d');
            context.drawImage(
              image,
              0,
              0,
              canvas.width,
              canvas.height
            );
            resolve(canvas.toDataURL('image/jpeg', 0.78));
          };

          image.onerror = () => {
            reject(new Error('无法读取所选图片'));
          };

          image.src = reader.result;
        };

        reader.onerror = () => {
          reject(new Error('无法读取所选文件'));
        };

        reader.readAsDataURL(file);
      });
    }

    /* ==============================
       内容安全处理
       避免用户输入被浏览器当作 HTML 执行
       ============================== */
    function escapeHtml(value) {
      const div = document.createElement('div');
      div.textContent = value;
      return div.innerHTML;
    }

    /* ==============================
       打开“添加竞品”弹窗
       清空表单并切换到新增模式
       ============================== */
    document
      .querySelector('#addButton')
      .addEventListener('click', () => {
        editingIndex = null;
        form.reset();
        dialogTitle.textContent = '添加竞品';
        saveButton.textContent = '保存竞品';
        dialog.showModal();
      });

    /* ==============================
       关闭弹窗
       点击“取消”后不保存本次修改
       ============================== */
    document
      .querySelector('#cancelButton')
      .addEventListener('click', () => {
        editingIndex = null;
        form.reset();
        dialog.close();
      });

    /* ==============================
       处理竞品卡片操作
       根据按钮类型执行编辑或删除
       ============================== */
    list.addEventListener('click', event => {
      const button = event.target.closest('button[data-action]');

      /* 点击的不是编辑或删除按钮时，不执行后续操作 */
      if (!button) {
        return;
      }

      const index = Number(button.dataset.index);
      const action = button.dataset.action;
      const competitor = competitors[index];

      /* 编辑竞品：把已有内容填入表单 */
      if (action === 'edit') {
        editingIndex = index;
        document.querySelector('#name').value = competitor.name;
        document.querySelector('#website').value = competitor.website;
        document.querySelector('#positioning').value =
          competitor.positioning;
        dialogTitle.textContent = '编辑竞品';
        saveButton.textContent = '保存修改';
        dialog.showModal();
      }

      /* 删除竞品：确认后删除并保存最新数据 */
      if (action === 'delete') {
        const confirmed = window.confirm(
          `确定删除“${competitor.name}”吗？`
        );

        if (!confirmed) {
          return;
        }

        competitors.splice(index, 1);
        localStorage.setItem(
          storageKey,
          JSON.stringify(competitors)
        );
        render();
      }
    });

    /* ==============================
       保存竞品
       新增模式会添加数据，编辑模式会更新数据
       ============================== */
    form.addEventListener('submit', event => {
      /* 阻止浏览器刷新页面 */
      event.preventDefault();

      /* 从表单中读取最新竞品信息 */
      const competitor = {
        id:
          editingIndex === null
            ? createId()
            : competitors[editingIndex].id,

        name:
          document.querySelector('#name')
            .value
            .trim(),

        website:
          document.querySelector('#website')
            .value
            .trim(),

        positioning:
          document.querySelector('#positioning')
            .value
            .trim()
      };

      /* 根据当前模式新增或更新竞品 */
      if (editingIndex === null) {
        competitors.push(competitor);
      } else {
        competitors[editingIndex] = competitor;
      }

      /* 保存到浏览器 localStorage */
      localStorage.setItem(
        storageKey,
        JSON.stringify(competitors)
      );

      /* 保存完成后退出编辑模式并清空表单 */
      editingIndex = null;
      form.reset();

      /* 关闭添加弹窗 */
      dialog.close();

      /* 重新显示最新竞品列表 */
      render();
    });

    /* ==============================
       打开添加证据弹窗
       没有竞品时先提醒用户创建竞品
       ============================== */
    document
      .querySelector('#addEvidenceButton')
      .addEventListener('click', () => {
        if (competitors.length === 0) {
          window.alert('请先添加至少一个竞品。');
          return;
        }

        resetEvidenceForm();
        evidenceDialog.showModal();
      });

    /* ==============================
       预览待上传图片
       同时检查原始文件是否超过 10MB
       ============================== */
    evidenceImage.addEventListener('change', () => {
      const file = evidenceImage.files[0];

      if (!file) {
        evidencePreview.removeAttribute('src');
        evidencePreview.style.display = 'none';
        return;
      }

      if (file.size > 10 * 1024 * 1024) {
        window.alert('图片不能超过 10MB，请选择较小的图片。');
        evidenceImage.value = '';
        evidencePreview.removeAttribute('src');
        evidencePreview.style.display = 'none';
        return;
      }

      const previewUrl = URL.createObjectURL(file);
      evidencePreview.onload = () => {
        URL.revokeObjectURL(previewUrl);
      };
      evidencePreview.src = previewUrl;
      evidencePreview.style.display = 'block';
    });

    /* ==============================
       取消添加证据
       关闭弹窗并清空临时内容
       ============================== */
    document
      .querySelector('#cancelEvidenceButton')
      .addEventListener('click', () => {
        resetEvidenceForm();
        evidenceDialog.close();
      });

    /* ==============================
       保存调研证据
       压缩图片后与评论一起保存到浏览器
       ============================== */
    evidenceForm.addEventListener('submit', async event => {
      event.preventDefault();
      const file = evidenceImage.files[0];

      if (!file) {
        window.alert('请选择一张证据图片。');
        return;
      }

      saveEvidenceButton.disabled = true;
      saveEvidenceButton.textContent = '正在保存…';

      try {
        const compressedImage = await compressImage(file);
        const evidence = {
          id: createId(),
          competitorId: evidenceCompetitor.value,
          image: compressedImage,
          comment:
            document.querySelector('#evidenceComment')
              .value
              .trim(),
          createdAt: new Date().toISOString()
        };

        evidenceItems.push(evidence);

        try {
          localStorage.setItem(
            evidenceStorageKey,
            JSON.stringify(evidenceItems)
          );
        } catch (storageError) {
          /* 保存失败时撤销刚才加入数组的数据 */
          evidenceItems.pop();
          throw new Error(
            '浏览器存储空间不足，请删除部分证据或选择更小的图片。'
          );
        }

        resetEvidenceForm();
        evidenceDialog.close();
        renderEvidence();
      } catch (error) {
        window.alert(error.message);
        saveEvidenceButton.disabled = false;
        saveEvidenceButton.textContent = '保存证据';
      }
    });

    /* ==============================
       删除调研证据
       确认后从浏览器中永久移除
       ============================== */
    evidenceList.addEventListener('click', event => {
      const button = event.target.closest(
        'button[data-evidence-action]'
      );

      if (!button) {
        return;
      }

      const index = Number(button.dataset.index);
      const confirmed = window.confirm(
        '确定删除这条调研证据吗？'
      );

      if (!confirmed) {
        return;
      }

      evidenceItems.splice(index, 1);
      localStorage.setItem(
        evidenceStorageKey,
        JSON.stringify(evidenceItems)
      );
      renderEvidence();
    });

    /* ==============================
       页面初始化
       第一次打开页面时显示已有数据
       ============================== */
    render();
  </script>
</body>
</html>
