<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>竞品洞察台</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #1f2937;
      background: #f5f7fb;
    }

    header {
      padding: 24px 40px;
      color: white;
      background: #4f46e5;
    }

    main {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 24px;
    }

    .hero {
      padding: 40px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin: 0 0 12px;
    }

    p {
      color: #6b7280;
      line-height: 1.7;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      color: white;
      background: #4f46e5;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <header>
    <strong>竞品洞察台</strong>
  </header>

  <main>
    <section class="hero">
      <h1>让竞品研究更有依据</h1>
      <p>
        集中管理竞品档案、调研证据、横向对比和关键洞察。
      </p>
      <button>添加第一个竞品</button>
    </section>
  </main>
</body>
</html>
