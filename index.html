<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 基础页面设置：定义中文语言、字符编码和移动端显示方式 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 浏览器标签页显示的页面名称 -->
  <title>竞品洞察台</title>

  <style>
    /* ==============================
       全局样式
       统一元素尺寸计算方式
       ============================== */
    * {
      box-sizing: border-box;
    }

    /* ==============================
       页面主体
       设置整体字体、文字颜色和背景色
       ============================== */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #1f2937;
      background: #f5f7fb;
    }

    /* ==============================
       顶部导航栏
       展示产品名称和英文名称
       ============================== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 40px;
      color: white;
      background: #4f46e5;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    /* ==============================
       页面主要内容区域
       限制最大宽度并保持居中
       ============================== */
    main {
      max-width: 1050px;
      margin: 36px auto;
      padding: 0 24px;
    }

    /* ==============================
       产品介绍区域
       展示产品价值和添加竞品按钮
       ============================== */
    .hero {
      padding: 32px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .06);
    }

    .hero h2 {
      margin-top: 0;
    }

    .hero p {
      color: #6b7280;
      line-height: 1.7;
    }

    /* ==============================
       通用按钮
       用于添加和保存等主要操作
       ============================== */
    button {
      padding: 11px 18px;
      color: white;
      background: #4f46e5;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    /* ==============================
       竞品档案区域标题
       ============================== */
    .section-title {
      margin: 32px 0 16px;
    }

    /* ==============================
       竞品卡片网格
       根据屏幕宽度自动调整列数
       ============================== */
    .grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(250px, 1fr)
      );
      gap: 16px;
    }

    /* ==============================
       单个竞品卡片
       展示产品名称、定位和官网
       ============================== */
    .card {
      padding: 20px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
    }

    .card h3 {
      margin: 0 0 10px;
    }

    .card p {
      min-height: 48px;
      color: #6b7280;
    }

    .card a {
      color: #4f46e5;
      text-decoration: none;
    }

    /* ==============================
       竞品卡片操作区
       提供编辑和删除当前竞品的操作
       ============================== */
    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .edit-button {
      background: #4f46e5;
    }

    .delete-button {
      background: #dc2626;
    }

    /* ==============================
       竞品卡片内的调研证据区域
       证据横向排列，超出宽度后可以左右滚动
       ============================== */
    .competitor-evidence {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
    }

    .evidence-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .evidence-header h4 {
      margin: 0;
      font-size: 15px;
    }

    .small-button {
      padding: 7px 11px;
      font-size: 13px;
    }

    .evidence-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 2px 2px 12px;
      scroll-snap-type: x proximity;
      scrollbar-width: thin;
    }

    .evidence-empty {
      min-width: 100%;
      padding: 18px;
      color: #6b7280;
      text-align: center;
      font-size: 14px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
    }

    /* 单条证据使用固定正方形卡片 */
    .evidence-tile {
      position: relative;
      flex: 0 0 160px;
      width: 160px;
      height: 160px;
      overflow: hidden;
      background: #e5e7eb;
      border-radius: 12px;
      cursor: pointer;
      scroll-snap-align: start;
    }

    /* 多图证据在方块内使用最多四格拼图 */
    .evidence-collage {
      display: grid;
      width: 100%;
      height: 100%;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 2px;
    }

    .evidence-collage.image-count-1 {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
    }

    .evidence-collage.image-count-2 {
      grid-template-rows: 1fr;
    }

    .evidence-collage img {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      object-fit: cover;
    }

    .evidence-count {
      position: absolute;
      top: 8px;
      right: 42px;
      padding: 4px 7px;
      color: white;
      background: rgba(15, 23, 42, .72);
      border-radius: 6px;
      font-size: 11px;
    }

    /* 评论以渐变遮罩显示在图片底部 */
    .evidence-overlay {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 28px 10px 10px;
      color: white;
      background: linear-gradient(
        transparent,
        rgba(15, 23, 42, .9)
      );
    }

    .evidence-overlay p {
      display: -webkit-box;
      margin: 0;
      overflow: hidden;
      font-size: 12px;
      line-height: 1.4;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .evidence-date {
      position: absolute;
      top: 8px;
      left: 8px;
      padding: 4px 7px;
      color: white;
      background: rgba(15, 23, 42, .72);
      border-radius: 6px;
      font-size: 11px;
    }

    .evidence-delete-button {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      padding: 0;
      background: rgba(220, 38, 38, .9);
      border-radius: 50%;
      font-size: 16px;
      line-height: 28px;
    }

    /* ==============================
       多图上传和截图粘贴区域
       展示选择方式、缩略图和单图移除按钮
       ============================== */
    .evidence-target {
      padding: 12px;
      color: #374151;
      background: #eef2ff;
      border-radius: 8px;
    }

    .paste-area {
      padding: 18px;
      color: #4f46e5;
      text-align: center;
      background: #f8fafc;
      border: 2px dashed #a5b4fc;
      border-radius: 10px;
      outline: none;
    }

    .paste-area:focus {
      background: #eef2ff;
      border-color: #4f46e5;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fill,
        minmax(90px, 1fr)
      );
      gap: 10px;
    }

    .preview-item {
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
      background: #e5e7eb;
      border-radius: 8px;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-remove-button {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 26px;
      height: 26px;
      padding: 0;
      background: rgba(220, 38, 38, .9);
      border-radius: 50%;
    }

    .form-help {
      margin: -6px 0 0;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.5;
    }

    /* ==============================
       证据详情弹窗
       完整展示所有图片和文字记录
       ============================== */
    .detail-dialog {
      width: min(900px, calc(100% - 32px));
      max-height: calc(100vh - 40px);
      overflow-y: auto;
    }

    .detail-meta {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: #6b7280;
    }

    .detail-images {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(240px, 1fr)
      );
      gap: 14px;
      margin: 18px 0;
    }

    .detail-images img {
      width: 100%;
      max-height: 520px;
      object-fit: contain;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
    }

    .detail-comment {
      padding: 16px;
      color: #374151;
      line-height: 1.7;
      white-space: pre-wrap;
      background: #f8fafc;
      border-radius: 10px;
    }

    /* ==============================
       空状态
       没有竞品数据时显示提示信息
       ============================== */
    .empty {
      padding: 28px;
      color: #6b7280;
      text-align: center;
      background: white;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
    }

    /* ==============================
       添加竞品弹窗
       用于填写竞品基本信息
       ============================== */
    dialog {
      width: min(460px, calc(100% - 32px));
      padding: 24px;
      border: 0;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .2);
    }

    /* 弹窗打开时的页面半透明遮罩 */
    dialog::backdrop {
      background: rgba(15, 23, 42, .5);
    }

    /* ==============================
       添加竞品表单
       设置输入项之间的间距
       ============================== */
    form {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 6px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px 12px;
      font: inherit;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }/* ==============================
       弹窗底部操作按钮区域
       ============================== */
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* 次要按钮：用于取消操作 */
    .secondary {
      color: #374151;
      background: #e5e7eb;
    }
  </style>
</head>

<body>
  <!-- ==============================
       顶部导航栏
       展示当前产品名称
       ============================== -->
  <header>
    <h1>竞品洞察台</h1>
    <span>Competitor Insights</span>
  </header>

  <!-- ==============================
       页面主要内容
       包含产品介绍和竞品档案
       ============================== -->
  <main>
    <!-- 产品介绍和主要操作区域 -->
    <section class="hero">
      <h2>让竞品研究更有依据</h2>

      <p>
        集中管理竞品档案、调研证据、横向对比和关键洞察。
      </p>

      <!-- 点击后打开添加竞品弹窗 -->
      <button id="addButton">
        添加竞品
      </button>
    </section>

    <!-- 竞品档案列表区域 -->
    <h2 class="section-title">竞品档案</h2>

    <!-- JavaScript 会把竞品卡片显示在这里 -->
    <section
      id="competitorList"
      class="grid">
    </section>
  </main>

  <!-- ==============================
       添加竞品弹窗
       收集产品名称、官网和产品定位
       ============================== -->
  <dialog id="competitorDialog">
    <form id="competitorForm">
      <!-- 编辑竞品时，JavaScript 会把标题改为“编辑竞品” -->
      <h2 id="dialogTitle">添加竞品</h2>

      <!-- 竞品名称：必填 -->
      <label>
        产品名称
        <input
          id="name"
          required
          placeholder="例如：Notion">
      </label>

      <!-- 竞品官网：选填，需要符合网址格式 -->
      <label>
        官网链接
        <input
          id="website"
          type="url"
          placeholder="https://example.com">
      </label>

      <!-- 产品定位：选填 -->
      <label>
        产品定位
        <textarea
          id="positioning"
          placeholder="用一句话描述产品定位"></textarea>
      </label>

      <!-- 表单操作按钮 -->
      <div class="actions">
        <button
          class="secondary"
          id="cancelButton"
          type="button">
          取消
        </button>

        <button id="saveButton" type="submit">
          保存竞品
        </button>
      </div>
    </form>
  </dialog>

  <!-- ==============================
       添加调研证据弹窗
       上传图片并填写对应评论
       ============================== -->
  <dialog id="evidenceDialog">
    <form id="evidenceForm">
      <h2>添加调研证据</h2>

      <!-- 显示从哪张竞品卡片打开了证据弹窗 -->
      <div class="evidence-target">
        对应竞品：
        <strong id="evidenceCompetitorName"></strong>
      </div>

      <!-- 可以一次选择多张本地图片 -->
      <label>
        证据图片
        <input
          id="evidenceImage"
          type="file"
          accept="image/*"
          multiple>
      </label>

      <p class="form-help">
        支持一次选择多张图片；建议每张原图不超过 10MB。
      </p>

      <!-- 点击后可以直接粘贴剪贴板中的截图 -->
      <div
        id="pasteArea"
        class="paste-area"
        tabindex="0">
        点击这里，然后按 Ctrl+V 或 Command+V 粘贴截图
      </div>

      <!-- 显示所有待保存图片的缩略图 -->
      <div
        id="evidencePreviewList"
        class="preview-grid">
      </div>

      <!-- 填写对图片内容的观察或评论 -->
      <label>
        证据评论
        <textarea
          id="evidenceComment"
          required
          placeholder="描述图片展示了什么，以及你从中发现了什么"></textarea>
      </label>

      <!-- 证据表单操作按钮 -->
      <div class="actions">
        <button
          class="secondary"
          id="cancelEvidenceButton"
          type="button">
          取消
        </button>

        <button id="saveEvidenceButton" type="submit">
          保存证据
        </button>
      </div>
    </form>
  </dialog>

  <!-- ==============================
       证据详情弹窗
       显示全部图片和完整文字记录
       ============================== -->
  <dialog id="evidenceDetailDialog" class="detail-dialog">
    <h2>证据详情</h2>

    <div class="detail-meta">
      <strong id="detailCompetitorName"></strong>
      <span id="detailCreatedDate"></span>
    </div>

    <!-- JavaScript 会把全部证据图片显示在这里 -->
    <div id="detailImages" class="detail-images"></div>

    <h3>文字记录</h3>
    <div id="detailComment" class="detail-comment"></div>

    <div class="actions">
      <button id="closeDetailButton" type="button">
        关闭
      </button>
    </div>
  </dialog>

  <script>
    /* ==============================
       浏览器存储名称
       分别保存竞品档案和调研证据
       ============================== */
    const storageKey = 'competitor-insights-items';
    const evidenceStorageKey = 'competitor-insights-evidence';

    /* ==============================
       获取竞品管理相关页面元素
       ============================== */
    const list = document.querySelector('#competitorList');
    const dialog = document.querySelector('#competitorDialog');
    const form = document.querySelector('#competitorForm');
    const dialogTitle = document.querySelector('#dialogTitle');
    const saveButton = document.querySelector('#saveButton');

    /* ==============================
       获取证据上传相关页面元素
       ============================== */
    const evidenceDialog = document.querySelector('#evidenceDialog');
    const evidenceForm = document.querySelector('#evidenceForm');
    const evidenceCompetitorName =
      document.querySelector('#evidenceCompetitorName');
    const evidenceImage = document.querySelector('#evidenceImage');
    const evidencePreviewList =
      document.querySelector('#evidencePreviewList');
    const pasteArea = document.querySelector('#pasteArea');
    const saveEvidenceButton =
      document.querySelector('#saveEvidenceButton');

    /* ==============================
       获取证据详情相关页面元素
       ============================== */
    const evidenceDetailDialog =
      document.querySelector('#evidenceDetailDialog');
    const detailCompetitorName =
      document.querySelector('#detailCompetitorName');
    const detailCreatedDate =
      document.querySelector('#detailCreatedDate');
    const detailImages = document.querySelector('#detailImages');
    const detailComment = document.querySelector('#detailComment');

    /* ==============================
       读取并迁移已有数据
       兼容旧版单图证据和无编号竞品
       ============================== */
    let competitors = readStoredArray(storageKey).map(item => ({
      ...item,
      id: item.id || createId()
    }));

    let evidenceItems = readStoredArray(evidenceStorageKey)
      .map(item => ({
        ...item,
        id: item.id || createId(),
        images:
          item.images ||
          (item.image ? [item.image] : [])
      }))
      .filter(item => item.images.length > 0);

    persistCompetitors();
    persistEvidence();

    /* 当前正在编辑的竞品序号，null 表示新增 */
    let editingIndex = null;

    /* 当前正在添加证据的竞品编号 */
    let selectedEvidenceCompetitorId = null;

    /* 待保存的图片文件和预览地址 */
    let pendingEvidenceFiles = [];
    let previewObjectUrls = [];

    /* ==============================
       渲染竞品档案
       每张竞品卡片内包含自己的证据横向列表
       ============================== */
    function render() {
      if (competitors.length === 0) {
        list.innerHTML = `
          <div class="empty">
            还没有竞品，点击上方按钮添加第一个。
          </div>
        `;
        return;
      }

      list.innerHTML = competitors
        .map((item, index) => {
          const relatedEvidence = evidenceItems
            .map((evidence, evidenceIndex) => ({
              evidence,
              evidenceIndex
            }))
            .filter(entry =>
              entry.evidence.competitorId === item.id
            );

          const evidenceMarkup = relatedEvidence.length
            ? relatedEvidence
                .map(entry => renderEvidenceTile(
                  entry.evidence,
                  entry.evidenceIndex
                ))
                .join('')
            : `
                <div class="evidence-empty">
                  还没有证据，点击“添加证据”上传图片。
                </div>
              `;

          return `
            <article class="card">
              <h3>${escapeHtml(item.name)}</h3>

              <p>
                ${escapeHtml(
                  item.positioning || '暂未填写产品定位'
                )}
              </p>

              ${
                item.website
                  ? `
                    <a
                      href="${escapeHtml(item.website)}"
                      target="_blank"
                      rel="noopener">
                      访问官网 →
                    </a>
                  `
                  : ''
              }

              <!-- 竞品档案基础操作 -->
              <div class="card-actions">
                <button
                  class="edit-button"
                  data-action="edit"
                  data-index="${index}">
                  编辑
                </button>

                <button
                  class="delete-button"
                  data-action="delete"
                  data-index="${index}">
                  删除
                </button>
              </div>

              <!-- 当前竞品关联的调研证据 -->
              <section class="competitor-evidence">
                <div class="evidence-header">
                  <h4>
                    调研证据（${relatedEvidence.length}）
                  </h4>

                  <button
                    class="small-button"
                    data-action="add-evidence"
                    data-competitor-id="${escapeHtml(item.id)}">
                    添加证据
                  </button>
                </div>

                <div class="evidence-scroll">
                  ${evidenceMarkup}
                </div>
              </section>
            </article>
          `;
        })
        .join('');
    }

    /* ==============================
       生成单个正方形证据卡片
       最多用四格拼图展示图片缩略图
       ============================== */
    function renderEvidenceTile(evidence, evidenceIndex) {
      const previewImages = evidence.images.slice(0, 4);
      const imageCountClass = `image-count-${
        Math.min(previewImages.length, 4)
      }`;
      const collage = previewImages
        .map(image => `
          <img src="${escapeHtml(image)}" alt="证据图片">
        `)
        .join('');
      const date = formatShortDate(evidence.createdAt);

      return `
        <article
          class="evidence-tile"
          data-evidence-action="view"
          data-index="${evidenceIndex}"
          title="点击查看证据详情">

          <div class="evidence-collage ${imageCountClass}">
            ${collage}
          </div>

          <span class="evidence-date">
            ${escapeHtml(date)}
          </span>

          ${
            evidence.images.length > 1
              ? `
                <span class="evidence-count">
                  ${evidence.images.length} 张
                </span>
              `
              : ''
          }

          <button
            class="evidence-delete-button"
            data-evidence-action="delete"
            data-index="${evidenceIndex}"
            type="button"
            title="删除证据">
            ×
          </button>

          <div class="evidence-overlay">
            <p>${escapeHtml(evidence.comment)}</p>
          </div>
        </article>
      `;
    }

    /* ==============================
       处理竞品卡片中的所有点击操作
       包括竞品编辑删除、添加证据和证据详情
       ============================== */
    list.addEventListener('click', event => {
      const evidenceControl = event.target.closest(
        '[data-evidence-action]'
      );

      if (evidenceControl) {
        const evidenceIndex = Number(
          evidenceControl.dataset.index
        );
        const evidenceAction =
          evidenceControl.dataset.evidenceAction;

        if (evidenceAction === 'view') {
          openEvidenceDetail(evidenceIndex);
        }

        if (evidenceAction === 'delete') {
          deleteEvidence(evidenceIndex);
        }

        return;
      }

      const button = event.target.closest('button[data-action]');
      if (!button) {
        return;
      }

      const action = button.dataset.action;

      if (action === 'add-evidence') {
        openEvidenceDialog(button.dataset.competitorId);
        return;
      }

      const index = Number(button.dataset.index);
      const competitor = competitors[index];

      if (action === 'edit') {
        editingIndex = index;
        document.querySelector('#name').value = competitor.name;
        document.querySelector('#website').value = competitor.website;
        document.querySelector('#positioning').value =
          competitor.positioning;
        dialogTitle.textContent = '编辑竞品';
        saveButton.textContent = '保存修改';
        dialog.showModal();
      }

      if (action === 'delete') {
        const evidenceCount = evidenceItems.filter(
          item => item.competitorId === competitor.id
        ).length;
        const message = evidenceCount > 0
          ? `确定删除“${competitor.name}”及其 ${evidenceCount} 条证据吗？`
          : `确定删除“${competitor.name}”吗？`;

        if (!window.confirm(message)) {
          return;
        }

        competitors.splice(index, 1);
        evidenceItems = evidenceItems.filter(
          item => item.competitorId !== competitor.id
        );
        persistCompetitors();
        persistEvidence();
        render();
      }
    });

    /* ==============================
       打开新增竞品弹窗
       ============================== */
    document
      .querySelector('#addButton')
      .addEventListener('click', () => {
        editingIndex = null;
        form.reset();
        dialogTitle.textContent = '添加竞品';
        saveButton.textContent = '保存竞品';
        dialog.showModal();
      });

    /* ==============================
       取消新增或编辑竞品
       ============================== */
    document
      .querySelector('#cancelButton')
      .addEventListener('click', () => {
        editingIndex = null;
        form.reset();
        dialog.close();
      });

    /* ==============================
       保存新增或编辑后的竞品
       编辑时保留原有唯一编号和证据关联
       ============================== */
    form.addEventListener('submit', event => {
      event.preventDefault();

      const competitor = {
        id:
          editingIndex === null
            ? createId()
            : competitors[editingIndex].id,
        name: document.querySelector('#name').value.trim(),
        website:
          document.querySelector('#website').value.trim(),
        positioning:
          document.querySelector('#positioning').value.trim()
      };

      if (editingIndex === null) {
        competitors.push(competitor);
      } else {
        competitors[editingIndex] = competitor;
      }

      persistCompetitors();
      editingIndex = null;
      form.reset();
      dialog.close();
      render();
    });

    /* ==============================
       打开指定竞品的证据上传弹窗
       ============================== */
    function openEvidenceDialog(competitorId) {
      const competitor = competitors.find(
        item => item.id === competitorId
      );

      if (!competitor) {
        window.alert('没有找到对应竞品。');
        return;
      }

      resetEvidenceForm();
      selectedEvidenceCompetitorId = competitorId;
      evidenceCompetitorName.textContent = competitor.name;
      evidenceDialog.showModal();
    }

    /* ==============================
       添加本地选择或剪贴板粘贴的多张图片
       ============================== */
    function addPendingFiles(files) {
      const validFiles = [];
      let oversizedCount = 0;
      let invalidCount = 0;

      files.forEach(file => {
        if (!file.type.startsWith('image/')) {
          invalidCount += 1;
          return;
        }

        if (file.size > 10 * 1024 * 1024) {
          oversizedCount += 1;
          return;
        }

        validFiles.push(file);
      });

      pendingEvidenceFiles.push(...validFiles);
      renderPendingPreviews();

      if (oversizedCount > 0) {
        window.alert(
          `${oversizedCount} 张图片超过 10MB，已跳过。`
        );
      }

      if (invalidCount > 0) {
        window.alert(
          `${invalidCount} 个文件不是图片，已跳过。`
        );
      }
    }

    /* 文件选择框支持一次选择多张图片 */
    evidenceImage.addEventListener('change', () => {
      addPendingFiles(Array.from(evidenceImage.files));
      evidenceImage.value = '';
    });

    /* ==============================
       支持把剪贴板截图粘贴到当前证据
       ============================== */
    pasteArea.addEventListener('paste', event => {
      const imageFiles = Array.from(
        event.clipboardData.items
      )
        .filter(item => item.type.startsWith('image/'))
        .map(item => item.getAsFile())
        .filter(Boolean);

      if (imageFiles.length === 0) {
        window.alert('剪贴板中没有可用的图片。');
        return;
      }

      event.preventDefault();
      addPendingFiles(imageFiles);
    });

    /* ==============================
       渲染所有待保存图片的缩略图
       每张图片都可以单独移除
       ============================== */
    function renderPendingPreviews() {
      revokePreviewUrls();

      previewObjectUrls = pendingEvidenceFiles.map(file =>
        URL.createObjectURL(file)
      );

      evidencePreviewList.innerHTML = previewObjectUrls
        .map((url, index) => `
          <div class="preview-item">
            <img
              src="${escapeHtml(url)}"
              alt="待保存图片 ${index + 1}">
            <button
              class="preview-remove-button"
              data-preview-index="${index}"
              type="button"
              title="移除图片">
              ×
            </button>
          </div>
        `)
        .join('');
    }

    evidencePreviewList.addEventListener('click', event => {
      const button = event.target.closest(
        'button[data-preview-index]'
      );

      if (!button) {
        return;
      }

      pendingEvidenceFiles.splice(
        Number(button.dataset.previewIndex),
        1
      );
      renderPendingPreviews();
    });

    /* ==============================
       保存包含多张图片和文字记录的证据
       ============================== */
    evidenceForm.addEventListener('submit', async event => {
      event.preventDefault();

      if (pendingEvidenceFiles.length === 0) {
        window.alert('请至少选择或粘贴一张证据图片。');
        return;
      }

      saveEvidenceButton.disabled = true;

      try {
        const compressedImages = [];

        for (
          let index = 0;
          index < pendingEvidenceFiles.length;
          index += 1
        ) {
          saveEvidenceButton.textContent =
            `正在处理 ${index + 1}/${pendingEvidenceFiles.length}…`;
          compressedImages.push(
            await compressImage(pendingEvidenceFiles[index])
          );
        }

        const evidence = {
          id: createId(),
          competitorId: selectedEvidenceCompetitorId,
          images: compressedImages,
          comment:
            document.querySelector('#evidenceComment')
              .value
              .trim(),
          createdAt: new Date().toISOString()
        };

        evidenceItems.push(evidence);

        try {
          persistEvidence();
        } catch (storageError) {
          evidenceItems.pop();
          throw new Error(
            '浏览器存储空间不足，请减少图片数量或删除旧证据。'
          );
        }

        evidenceDialog.close();
        resetEvidenceForm();
        render();
      } catch (error) {
        window.alert(error.message);
        saveEvidenceButton.disabled = false;
        saveEvidenceButton.textContent = '保存证据';
      }
    });

    /* ==============================
       取消添加证据并清空临时图片
       ============================== */
    document
      .querySelector('#cancelEvidenceButton')
      .addEventListener('click', () => {
        evidenceDialog.close();
        resetEvidenceForm();
      });

    /* ==============================
       打开证据详情
       完整展示所有图片和文字记录
       ============================== */
    function openEvidenceDetail(evidenceIndex) {
      const evidence = evidenceItems[evidenceIndex];
      if (!evidence) {
        return;
      }

      const competitor = competitors.find(
        item => item.id === evidence.competitorId
      );

      detailCompetitorName.textContent = competitor
        ? competitor.name
        : '已删除的竞品';
      detailCreatedDate.textContent =
        formatDate(evidence.createdAt);
      detailImages.innerHTML = evidence.images
        .map((image, index) => `
          <img
            src="${escapeHtml(image)}"
            alt="证据图片 ${index + 1}">
        `)
        .join('');
      detailComment.textContent = evidence.comment;
      evidenceDetailDialog.showModal();
    }

    document
      .querySelector('#closeDetailButton')
      .addEventListener('click', () => {
        evidenceDetailDialog.close();
      });

    /* ==============================
       删除单条证据
       删除按钮独立于详情点击操作
       ============================== */
    function deleteEvidence(evidenceIndex) {
      if (!window.confirm('确定删除这条调研证据吗？')) {
        return;
      }

      evidenceItems.splice(evidenceIndex, 1);
      persistEvidence();
      render();
    }

    /* ==============================
       重置证据表单和图片预览
       ============================== */
    function resetEvidenceForm() {
      evidenceForm.reset();
      selectedEvidenceCompetitorId = null;
      pendingEvidenceFiles = [];
      revokePreviewUrls();
      evidencePreviewList.innerHTML = '';
      evidenceCompetitorName.textContent = '';
      saveEvidenceButton.disabled = false;
      saveEvidenceButton.textContent = '保存证据';
    }

    function revokePreviewUrls() {
      previewObjectUrls.forEach(url =>
        URL.revokeObjectURL(url)
      );
      previewObjectUrls = [];
    }

    /* ==============================
       压缩单张证据图片
       最长边限制为 1600 像素并输出 JPEG
       ============================== */
    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => {
          const image = new Image();

          image.onload = () => {
            const maxSize = 1600;
            const scale = Math.min(
              1,
              maxSize / Math.max(image.width, image.height)
            );
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(image.width * scale);
            canvas.height = Math.round(image.height * scale);
            const context = canvas.getContext('2d');
            context.drawImage(
              image,
              0,
              0,
              canvas.width,
              canvas.height
            );
            resolve(canvas.toDataURL('image/jpeg', 0.78));
          };

          image.onerror = () => {
            reject(new Error('无法读取所选图片。'));
          };
          image.src = reader.result;
        };

        reader.onerror = () => {
          reject(new Error('无法读取所选文件。'));
        };
        reader.readAsDataURL(file);
      });
    }

    /* ==============================
       数据读写和通用辅助函数
       ============================== */
    function readStoredArray(key) {
      try {
        const value = JSON.parse(
          localStorage.getItem(key) || '[]'
        );
        return Array.isArray(value) ? value : [];
      } catch (error) {
        return [];
      }
    }

    function persistCompetitors() {
      localStorage.setItem(
        storageKey,
        JSON.stringify(competitors)
      );
    }

    function persistEvidence() {
      localStorage.setItem(
        evidenceStorageKey,
        JSON.stringify(evidenceItems)
      );
    }

    function createId() {
      if (
        window.crypto &&
        typeof window.crypto.randomUUID === 'function'
      ) {
        return window.crypto.randomUUID();
      }
      return `${Date.now()}-${Math.random()}`;
    }

    function formatDate(value) {
      return new Date(value).toLocaleDateString('zh-CN');
    }

    function formatShortDate(value) {
      return new Date(value).toLocaleDateString('zh-CN', {
        month: 'numeric',
        day: 'numeric'
      });
    }

    /* 避免用户输入被浏览器当作 HTML 执行 */
    function escapeHtml(value) {
      const div = document.createElement('div');
      div.textContent = String(value ?? '');
      return div.innerHTML;
    }

    /* 页面初始化 */
    render();
  </script>
</body>
</html>
